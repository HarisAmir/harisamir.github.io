<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <script>
      (() => {
        let saved
        try { saved = localStorage.getItem('haris-theme') } catch {}
        const theme = saved === 'light' || saved === 'dark' ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#000000' : '#ffffff'
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--page-meta-->
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
